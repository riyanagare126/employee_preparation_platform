<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register an employee/candidate account on AI Employee Preparation Platform">
  <title>Create Account | AI Employee Preparation Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Minimal Header -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon"><i class="fa-solid fa-robot"></i></span>
        <span>AI Employee <span class="brand-highlight">Prep</span></span>
      </a>
      <div>
        <a href="login.html" class="btn btn-outline-primary btn-sm"><span class="desktop-only">Already have an account?
          </span>Login</a>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-box" style="max-width: 650px;">
          <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-pen-to-square"></i></div>
            <h1 class="auth-title">Candidate Registration</h1>
            <p class="auth-subtitle">Create your preparation account and personalize your AI learning path</p>
          </div>

          <!-- Registration Alert Message Box -->
          <div id="register-alert"
            style="display: none; padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 0.9rem; font-weight: 500;">
          </div>

          <form id="register-form">
            <div class="form-row">
              <!-- Full Name -->
              <div class="form-group">
                <label for="name" class="form-label">Full Name <span style="color: var(--rose-500);">*</span></label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required>
              </div>

              <!-- Email -->
              <div class="form-group">
                <label for="email" class="form-label">Email Address <span
                    style="color: var(--rose-500);">*</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. user@example.com"
                  required>
              </div>
            </div>

            <div class="form-row">
              <!-- Password -->
              <div class="form-group">
                <label for="password" class="form-label">Password (min 6 chars) <span
                    style="color: var(--rose-500);">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                  minlength="6" required>
              </div>

              <!-- Confirm Password -->
              <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password <span
                    style="color: var(--rose-500);">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                  placeholder="••••••••" minlength="6" required>
              </div>
            </div>

            <div class="form-row">
              <!-- Qualification -->
              <div class="form-group">
                <label for="qualification" class="form-label">Educational Qualification <span
                    style="color: var(--rose-500);">*</span></label>
                <select id="qualification" name="qualification" class="form-select" required>
                  <option value="" disabled selected>Select Qualification</option>
                  <option value="BSc IT">BSc IT (Information Technology)</option>
                  <option value="BCA">BCA (Bachelor of Computer Applications)</option>
                  <option value="B.Tech Computer Science">B.Tech Computer Science</option>
                  <option value="B.Sc Computer Science">B.Sc Computer Science</option>
                  <option value="MCA / M.Tech">MCA / M.Tech</option>
                  <option value="Diploma in Engineering">Diploma in Engineering</option>
                  <option value="Other Degree">Other Degree</option>
                </select>
              </div>

              <!-- Experience -->
              <div class="form-group">
                <label for="experience" class="form-label">Experience Level <span
                    style="color: var(--rose-500);">*</span></label>
                <select id="experience" name="experience" class="form-select" required>
                  <option value="" disabled selected>Select Experience</option>
                  <option value="Fresher" selected>Fresher (0 years)</option>
                  <option value="0-1 Years">0 - 1 Years</option>
                  <option value="1-3 Years">1 - 3 Years</option>
                  <option value="3+ Years">3+ Years</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <!-- Target Job Role -->
              <div class="form-group">
                <label for="job_role" class="form-label">Target Job Role <span
                    style="color: var(--rose-500);">*</span></label>
                <select id="job_role" name="job_role" class="form-select" required>
                  <option value="" disabled selected>Select Target Career Role</option>
                  <option value="Software Developer">Software Developer</option>
                  <option value="Java Developer" selected>Java Developer</option>
                  <option value="Python Developer">Python Developer</option>
                  <option value="Web Developer">Web Developer / Frontend</option>
                  <option value="Data Analyst">Data Analyst</option>
                  <option value="Software Engineer">Software Engineer</option>
                  <option value="QA Tester">QA Tester / Automation</option>
                </select>
              </div>

              <!-- Target Company -->
              <div class="form-group">
                <label for="target_company" class="form-label">Initial Target Company</label>
                <select id="target_company" name="target_company" class="form-select">
                  <option value="Tata Consultancy Services (TCS)" selected>Tata Consultancy Services (TCS)</option>
                  <option value="Infosys">Infosys</option>
                  <option value="Wipro">Wipro</option>
                  <option value="Capgemini">Capgemini</option>
                  <option value="Deloitte">Deloitte</option>
                  <option value="Red Hat">Red Hat</option>
                  <option value="Accenture">Accenture</option>
                  <option value="Cognizant">Cognizant</option>
                  <option value="HCLTech">HCLTech</option>
                  <option value="Tech Mahindra">Tech Mahindra</option>
                  <option value="IBM">IBM</option>
                  <option value="LTIMindtree">LTIMindtree</option>
                  <option value="Persistent Systems">Persistent Systems</option>
                  <option value="Oracle">Oracle</option>
                  <option value="Microsoft">Microsoft</option>
                  <option value="Google">Google</option>
                  <option value="Amazon">Amazon</option>
                  <option value="SAP">SAP</option>
                  <option value="EY">EY</option>
                  <option value="PwC">PwC</option>
                </select>
              </div>
            </div>

            <!-- Skills -->
            <div class="form-group">
              <label for="skills" class="form-label">Technical Skills (comma separated) <span
                  style="color: var(--rose-500);">*</span></label>
              <input type="text" id="skills" name="skills" class="form-control"
                placeholder="e.g. Java, Python, HTML, CSS, JavaScript, SQL" value="Java, Python, SQL, DSA" required>
              <div class="form-helper">List your programming languages, frameworks, or database skills.</div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-submit"
              style="margin-top: 12px;">
              Create Account <i class="fa-solid fa-rocket"></i>
            </button>
          </form>

          <div class="auth-footer">
            Already registered? <a href="login.html" style="font-weight: 600;">Sign in here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Redirect if already logged in
      redirectIfLoggedIn();

      const form = document.getElementById("register-form");
      const alertBox = document.getElementById("register-alert");
      const submitBtn = document.getElementById("btn-register-submit");

      function showAlert(msg, isSuccess = false) {
        alertBox.style.display = "block";
        alertBox.textContent = msg;
        if (isSuccess) {
          alertBox.style.background = "#d1fae5";
          alertBox.style.color = "#065f46";
          alertBox.style.border = "1px solid #a7f3d0";
        } else {
          alertBox.style.background = "#fee2e2";
          alertBox.style.color = "#991b1b";
          alertBox.style.border = "1px solid #fecaca";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm_password = document.getElementById("confirm_password").value;
        const qualification = document.getElementById("qualification").value;
        const experience = document.getElementById("experience").value;
        const job_role = document.getElementById("job_role").value;
        const target_company = document.getElementById("target_company").value;
        const skills = document.getElementById("skills").value.trim();

        // Frontend validation
        if (!name || !email || !password || !confirm_password || !qualification || !experience || !job_role || !skills) {
          showAlert("Please fill in all required fields.");
          return;
        }

        if (password.length < 6) {
          showAlert("Password must be at least 6 characters long.");
          return;
        }

        if (password !== confirm_password) {
          showAlert("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";

        try {
          const response = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              email,
              password,
              confirm_password,
              qualification,
              experience,
              job_role,
              target_company,
              target_role: job_role,
              skills
            })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            showAlert("Account created successfully! Redirecting to login...", true);
            showToast("Account created successfully!", "success");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1000);
          } else {
            showAlert(data.message || "Registration failed. Please check your details.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Create Account <i class="fa-solid fa-rocket"></i>';
          }
        } catch (err) {
          console.error("Registration error:", err);
          showAlert("Could not connect to backend server. Please verify the server is running.");
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Create Account <i class="fa-solid fa-rocket"></i>';
        }
      });
    });
  </script>
</body>

</html>
