            <h2>1. Abstract & Executive Summary</h2>
            <p>
                In the contemporary campus recruitment and corporate hiring landscape of 2026, traditional candidate preparation methodologies have become severely disconnected from enterprise evaluation standards. Tier-1 enterprise recruiters—including Google, Microsoft, Amazon, Tata Consultancy Services (TCS), and Infosys—have fundamentally transformed their screening funnels:
            </p>
            <ul>
                <li><strong>Algorithmic ATS Gatekeeping:</strong> Over 75% of candidate resumes are filtered out before human evaluation due to parsing failures caused by multi-column formats or missing semantic keywords aligned with corporate job descriptions.</li>
                <li><strong>Enterprise Preparation Divergence:</strong> Preparation cannot be one-size-fits-all; an applicant targeting TCS requires extensive foundational quantitative aptitude and core OOPs/DBMS, whereas an Amazon or Google applicant is evaluated on distributed systems, algorithmic complexity, and behavioral leadership rubrics.</li>
                <li><strong>The 2026 "AI Fluency" Round:</strong> Modern engineering organizations evaluate how candidates leverage AI coding assistants (e.g. GitHub Copilot, Cursor) while enforcing a rigorous zero-trust verification mindset, automated test generation, and invariant assertions.</li>
                <li><strong>The 60-Second Verbal Filter:</strong> Over 80% of hiring impressions are formed during the introductory "Tell me about yourself" answer.</li>
            </ul>
            <p>
                The <strong>AI Employee Preparation & Placement Readiness Platform</strong> is an end-to-end, production-ready system providing unified diagnostic testing, enterprise-calibrated smart roadmaps, single-column ATS resume engineering, conversational AI mock interviews, and real-time gamification.
            </p>
        </section>

        <!-- Section 2 -->
        <section id="section-2">
            <h2>2. Problem Statement & Project Objectives</h2>
            <div class="callout callout-warning">
                <strong>Industry Problem:</strong>
                Candidates face fragmented preparation across disparate single-purpose sites (LeetCode for coding, IndiaBIX for aptitude, Canva for non-ATS resumes), leaving candidates with zero holistic visibility into their true enterprise job-readiness.
            </div>
            <h3>Key Project Objectives:</h3>
            <ol>
                <li><strong>Holistic Job Readiness:</strong> Unify aptitude tests, live coding sandbox, resume ATS scoring, behavioral pitches, and AI fluency into an integrated 5-pillar composite index (0–100%).</li>
                <li><strong>Company-Specific Roadmaps:</strong> Dynamically generate 7, 14, 30, or 60-day structured preparation schedules tailored to specific enterprise syllabi (e.g. TCS vs. Amazon).</li>
                <li><strong>Recruiter-Approved ATS Resumes:</strong> Provide single-column ATS layouts with real-time AI STAR bullet enhancement and instant print-to-PDF formatting.</li>
                <li><strong>Zero-Friction Evaluation:</strong> Guarantee 1-click execution, self-healing database initialization, and pre-seeded student and administrator accounts for seamless viva demonstration.</li>
            </ol>
        </section>

            <p>
                Rather than relying on subjective self-evaluations, the platform implements a transparent mathematical formula to calculate aggregate employability:
            </p>

            <div class="formula-card">
                Readiness Score = (0.25 × Aptitude) + (0.25 × Coding) + (0.20 × Technical Domain) + (0.15 × Mock Interview) + (0.15 × Resume ATS)
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Pillar</th>
                        <th>Weight</th>
                        <th>Evaluation Mechanism</th>
                        <th>Benchmark for Job-Readiness</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Aptitude & Logic</strong></td>
                        <td>25%</td>
                        <td>Timed quantitative, reasoning & verbal tests with tab-switch detection</td>

                    </tr>
                    <tr>
                        <td><strong>Coding Problem Solving</strong></td>

            <div class="viva-card">
                <div class="viva-q"><span>Q1:</span> How does this platform differ from standard placement portals?</div>
                <div class="viva-a">
                    Traditional platforms operate in silos—LeetCode for coding, IndiaBIX for aptitude, and Canva for unparsable multi-column resumes. Our system consolidates all prep dimensions into an objective 5-Pillar Readiness Score and introduces 2026 hiring standards: enterprise-tailored smart roadmaps, single-column ATS resume scoring, the 2026 AI Fluency Round, and the 60-Second Pitch Builder.
                </div>
            </div>

            <div class="viva-card">
                <div class="viva-q"><span>Q2:</span> What is the significance of the 2026 AI Fluency Round?</div>
                <div class="viva-a">
                    Modern tech employers do not ask whether candidates know AI; they test whether candidates use AI tools (Copilot, Cursor) safely and effectively. Our grading engine evaluates candidates on Tool Integration, Verification Mindset (writing automated tests and checking invariants), Velocity, and Authenticity.
                </div>
            </div>

            <div class="viva-card">
                <div class="viva-q"><span>Q3:</span> How does the platform enforce anti-cheating during tests?</div>
                <div class="viva-a">
                    Test sessions generate a unique cryptographic session token. The frontend monitors browser tab-switching and window blurs, flagging violations. Server-side timestamps prevent client-side timer manipulation.
                </div>
            </div>

            <div class="viva-card">
                <div class="viva-q"><span>Q4:</span> How is the backend structured to support both Flask and FastAPI?</div>
                <div class="viva-a">
                    The backend uses a shared relational database (SQLite3) managed with SQLAlchemy declarative models. Standard requests execute via Flask WSGI on port 5000, while asynchronous workloads can run via FastAPI ASGI on port 8000 using Uvicorn.
                </div>
            </div>
        </section>
